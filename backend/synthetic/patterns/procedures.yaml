# Common procedure (CPT) and diagnosis (ICD-10) codes with typical charges.
# valid_dx lists ICD-10 codes that legitimately pair with each CPT.
# A claim whose dx is NOT in valid_dx is a coding mismatch the scrubber should catch.
procedures:
  - cpt: "99213"
    description: "Office visit, established patient, low complexity"
    charge: 120.0
    requires_modifier: false
    valid_dx: ["E11.9", "I10", "J06.9", "M54.5"]
