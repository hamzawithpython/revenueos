services:
  postgres:
    image: postgres:16
    container_name: revenueos-postgres
    environment:
      POSTGRES_USER: revenueos
      POSTGRES_PASSWORD: revenueos
      POSTGRES_DB: revenueos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
