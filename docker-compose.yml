services:
  postgres:
    image: postgres:16
    container_name: revenueos-postgres
    environment:
      POSTGRES_USER: revenueos
      POSTGRES_PASSWORD: revenueos
      POSTGRES_DB: revenueos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueos"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-eligibility:
    build:
      context: ./backend
    container_name: revenueos-mock-eligibility
    command: uvicorn app.mocks.eligibility.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8001/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  mock-clearinghouse:
    build:
      context: ./backend
    container_name: revenueos-mock-clearinghouse
    command: uvicorn app.mocks.clearinghouse.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8002/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  mock-payer:
    build:
      context: ./backend
    container_name: revenueos-mock-payer
    command: uvicorn app.mocks.payer.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8003/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./backend
    container_name: revenueos-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://revenueos:revenueos@postgres:5432/revenueos
      MOCK_ELIGIBILITY_URL: http://mock-eligibility:8001
      MOCK_CLEARINGHOUSE_URL: http://mock-clearinghouse:8002
      MOCK_PAYER_URL: http://mock-payer:8003
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
      mock-eligibility:
        condition: service_healthy
      mock-clearinghouse:
        condition: service_healthy
      mock-payer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

